# Example configuration for messaging-service. Copy outside the repository, fill the placeholders
# and pass it with --spring.config.additional-location=file:./application.properties
# Never commit real credentials.

server.port=8383
spring.webflux.base-path=/api
server.forward-headers-strategy=framework

spring.data.mongodb.host=<mongo-host>
spring.data.mongodb.port=27017
spring.data.mongodb.database=messaging
spring.data.mongodb.username=<mongo-user>
spring.data.mongodb.password=<mongo-password>
spring.data.mongodb.auto-index-creation=true

# Require this value in the X-API-Key header on every request (health and docs excepted)
messaging-system.api-key=<api-key>

# Require a bearer JWT on every request (leave commented out to disable; never set it empty)
#spring.security.oauth2.resourceserver.jwt.issuer-uri=https://<idp-host>/realms/<realm>
#spring.security.oauth2.resourceserver.jwt.audiences=<audience>

# Error reporting (optional)
#sentry.dsn=<sentry-dsn>

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.level.root=INFO

# Client side (application embedding messaging-client):
# messaging-system.client.endpoint=http://<messaging-host>:8383/api/
# messaging-system.client.api-key=<api-key>
# messaging-system.client.connect-timeout=10s
# messaging-system.client.response-timeout=30s
