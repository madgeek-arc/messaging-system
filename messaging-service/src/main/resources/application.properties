## Application ##
# Resolved from the Maven project version at build time
project.version=@project.version@

## Server ##
server.port=8383
# All endpoints are served under this prefix (e.g. http://localhost:8383/api/threads)
spring.webflux.base-path=/api
# Honour X-Forwarded-* headers from a reverse proxy
server.forward-headers-strategy=framework

## Actuator ##
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

## MongoDB ##
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=messaging-dev
# Leave empty when authentication is disabled
spring.data.mongodb.username=
spring.data.mongodb.password=
spring.data.mongodb.auto-index-creation=true

## Security (JWT resource server) ##
# Set the issuer to require a valid "Authorization: Bearer <jwt>" on every request.
# When unset (do not leave it empty) all endpoints are public.
#spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

## Springdoc ##
# Set next two to true to enable the OpenAPI document and Swagger UI
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

## Logging ##
logging.level.root=INFO
logging.level.gr=INFO
logging.level.org.springframework=INFO
logging.level.io.sentry=INFO
